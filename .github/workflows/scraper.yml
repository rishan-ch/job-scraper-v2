name: Jora Scraper Execution

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Scraper CLI
        run: dotnet run --project JoraScraper.csproj -- --run-scraper
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          # Passing the license via Env variable is a good backup safety net
          EPPlusLicense: NonCommercialPersonal 

      - name: Upload Scraper Results
        if: always() # Runs even if the scraper fails or returns 0
        uses: actions/upload-artifact@v4
        with:
          name: Jora-Scraper-Results
          # CHANGE: Upload the whole folder to catch the .xlsx AND the .png
          path: DataExports/
          retention-days: 7